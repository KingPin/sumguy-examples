apiVersion: v1
kind: Pod
metadata: {name: oom-demo}
spec:
  restartPolicy: Never
  containers:
    - name: hog
      image: python:3.13-alpine
      command: ["python", "-c", "b = bytearray(200 * 1024 * 1024); b[::4096] = b'x' * len(b[::4096]); print('allocated')"]
      resources:
        requests: {memory: 64Mi}
        limits: {memory: 64Mi}
