# Agent-friendly tmux settings. Tested against tmux 3.8.
set -g history-limit 100000
set -g mouse on

# Shift+Enter reaches the agent as a distinct key.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Let OSC 52 clipboard writes and notifications from the visible pane reach the outer terminal.
# Use 'allow-passthrough all' to pass them from background windows too.
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on

# A bell in any window flags that window in the status bar.
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off
set -g window-status-bell-style 'bg=red,fg=white,bold'

# New windows start at 1 so the keys line up with the status bar.
set -g base-index 1
