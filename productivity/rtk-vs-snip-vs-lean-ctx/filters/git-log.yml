name: "git-log"
version: 1
description: "Condense git log to hash + one-line message so the agent sees 10 commits, not 10 screens"

match:
  command: "git"
  subcommand: "log"
  # don't touch calls where the user already picked a format
  exclude_flags: ["--format", "--pretty", "--oneline"]

inject:
  args: ["--pretty=format:%h %s (%ar) <%an>", "--no-merges"]
  defaults:
    "-n": "10"

pipeline:
  - action: "keep_lines"
    pattern: "\\S"
  - action: "truncate_lines"
    max: 80
  - action: "format_template"
    template: "{{.count}} commits:\n{{.lines}}"

# if anything in the pipeline errors, hand back the ORIGINAL output untouched.
# this is the line that stops a filter from silently eating your data.
on_error: "passthrough"
