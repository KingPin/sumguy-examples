services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - kuma-data:/app/data
    mem_limit: 512m
    pids_limit: 512
    networks: [apps]

  whoami:
    image: traefik/whoami:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    networks: [apps]

volumes:
  kuma-data:

networks:
  apps:
