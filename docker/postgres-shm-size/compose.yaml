# Three copies of the same Postgres, differing only in shared memory setup.
# Run ./run.sh to reproduce the error and both fixes.
x-pg: &pg
  image: postgres:18.6
  environment:
    POSTGRES_PASSWORD: example
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "postgres"]
    interval: 2s
    retries: 30

services:
  # Docker default: /dev/shm is 64MB
  pg-default:
    <<: *pg

  # Fix 1: give /dev/shm room
  pg-shm:
    <<: *pg
    shm_size: 1gb

  # Fix 2: preallocate parallel-query memory inside Postgres's main segment
  pg-mindsm:
    <<: *pg
    command: ["postgres", "-c", "min_dynamic_shared_memory=512MB"]

  # Trap: big /dev/shm, small memory limit. tmpfs pages count against the cgroup.
  pg-tight:
    <<: *pg
    shm_size: 1gb
    mem_limit: 256m
    memswap_limit: 256m
