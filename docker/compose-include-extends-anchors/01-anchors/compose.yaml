x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3

x-env: &env
  TZ: UTC
  LOG_LEVEL: info

services:
  web:
    <<: *common
    image: nginx:alpine
    environment:
      <<: *env
      LOG_LEVEL: debug
    ports:
      - "8088:80"

  docs:
    <<: *common
    image: nginx:alpine
    environment: *env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 5s
