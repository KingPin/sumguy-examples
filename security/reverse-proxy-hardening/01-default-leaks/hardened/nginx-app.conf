# Part 1 fixes only: banners, catch-all, forwarding headers, error pages.
# TLS settings, security headers, rate limits and admin paths come in later parts.
server_tokens off;

# Catch-all: anything that is not app.example.test gets nothing.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;   # no SNI or unknown SNI: refuse before sending a cert
    return 444;                # plain HTTP: close the connection without a response
}

server {
    listen 80;
    server_name app.example.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.example.test;

    ssl_certificate     /certs/app.crt;
    ssl_certificate_key /certs/app.key;

    proxy_hide_header X-Powered-By;

    # Replace upstream error bodies (stack traces) and nginx's own error pages.
    proxy_intercept_errors on;
    error_page 500 502 503 504 @error;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # edge proxy: overwrite, never append
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @error {
        default_type text/plain;
        return 502 "Something went wrong.\n";
    }
}
