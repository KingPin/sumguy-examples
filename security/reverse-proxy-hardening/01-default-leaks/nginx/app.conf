# The minimal HTTPS proxy most tutorials hand you.
# The image's own default.conf stays in place, as it does on a fresh install.
server {
    listen 80;
    server_name app.example.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.example.test;

    ssl_certificate     /certs/app.crt;
    ssl_certificate_key /certs/app.key;

    location / {
        proxy_pass http://backend:8080;
    }
}
