# Part 1 to 4 fixes plus Part 5 admin protection. conf.d is included inside http {}.
server_tokens off;

# --- Part 2: TLS (unchanged) ---
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# --- Part 3: headers (unchanged) ---
map $upstream_http_referrer_policy $referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}

# --- Part 4: real client IP, then rate limits keyed on it ---
# Believe X-Forwarded-For only when the CDN sent the request. With real_ip_recursive on, nginx walks the
# header right to left past trusted addresses and stops at the first one it does not trust: the client.
# Behind Cloudflare: list its published ranges here and use real_ip_header CF-Connecting-IP instead.
set_real_ip_from 172.31.40.10;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# $binary_remote_addr is now the client, not the CDN.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# The default is 503, the same code a dead backend gets. 429 tells the client to slow down.
limit_req_status 429;
# Retry-After for the 429 page: a login slot frees every 12 s at 5r/m, an API slot every 0.1 s.
map $uri $retry_after {
    /login  12;
    default 1;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name app.example.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.example.test;

    ssl_certificate     /certs/app.crt;
    ssl_certificate_key /certs/app.key;

    add_header_inherit merge;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy $referrer_policy always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Content-Type-Options;
    proxy_intercept_errors on;
    error_page 500 502 503 504 @error;
    # Without this, a 429 is nginx's stock HTML page, with "nginx" in the body (the Part 1 leak again).
    error_page 429 @ratelimited;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # --- Part 5: the identity header comes from the auth server or not at all ---
    # Set here, at server level, so every location sends it. A proxy_set_header inside a location
    # would replace ALL of the lines above for that location (the app then sees Host: backend:8080).
    # $auth_user is empty everywhere except /admin, and nginx drops a header whose value is empty,
    # so a client's own Remote-User never reaches the app.
    proxy_set_header Remote-User $auth_user;
    set $auth_user "";
    # Stock 401 and 403 pages say "nginx" in the body (the Part 1 leak).
    error_page 401 @unauthorized;
    error_page 403 @forbidden;

    location / {
        proxy_pass http://backend:8080;
    }

    location = /login {
        # nodelay: the 5 extra attempts are answered now instead of queued 12 s apart
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8080;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:8080;
    }

    # --- Part 5: the admin panel, LAN only, behind forward auth ---
    # ~* is case-insensitive, because Express (and most app routers) are. nginx matches against the
    # decoded, cleaned path, so //admin, /./admin and /%61dmin land here too.
    location ~* ^/admin {
        allow 172.31.50.101;    # the admin's LAN machine
        deny all;
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_remote_user;
        proxy_pass http://backend:8080;
    }

    location = /_auth {
        internal;
        proxy_pass http://auth:9091/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @unauthorized {
        default_type text/plain;
        return 401 "Login required.\n";
    }

    location @forbidden {
        default_type text/plain;
        return 403 "Forbidden.\n";
    }

    location @ratelimited {
        default_type text/plain;
        add_header Retry-After $retry_after always;
        return 429 "Too many requests.\n";
    }

    location @error {
        default_type text/plain;
        return 502 "Something went wrong.\n";
    }
}
