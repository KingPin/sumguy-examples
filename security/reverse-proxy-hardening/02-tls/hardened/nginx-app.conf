# Part 1 fixes plus Part 2 TLS settings (Mozilla intermediate, guidelines v6.0).
# The ssl_* lines below sit at http level (conf.d is included inside http {}), so every server inherits them.
server_tokens off;

# --- Part 2: TLS ---
ssl_protocols TLSv1.2 TLSv1.3;
# Needs OpenSSL 3.5+ for X25519MLKEM768; nginx refuses to start on older OpenSSL.
ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
# TLS 1.2 only. TLS 1.3 suites are set separately and the defaults are fine.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
# Resume through a shared server-side cache, tickets off. With tickets on and no shared cache,
# nginx encrypts every ticket with one random key that lives until restart. A stolen ticket key
# decrypts every recorded TLS 1.2 connection that got a ticket under it, first handshake included.
# Tickets off takes that key out of the picture.
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Catch-all: anything that is not app.example.test gets nothing.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name app.example.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.example.test;

    ssl_certificate     /certs/app.crt;
    ssl_certificate_key /certs/app.key;

    # Two years. "always" adds it to error responses too. No includeSubDomains or preload here:
    # read the post before you add either.
    add_header Strict-Transport-Security "max-age=63072000" always;

    proxy_hide_header X-Powered-By;
    proxy_intercept_errors on;
    error_page 500 502 503 504 @error;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @error {
        default_type text/plain;
        return 502 "Something went wrong.\n";
    }
}
