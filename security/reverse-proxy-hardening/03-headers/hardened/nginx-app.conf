# Part 1 and Part 2 fixes plus Part 3 security headers. conf.d is included inside http {}.
server_tokens off;

# --- Part 2: TLS (unchanged) ---
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# --- Part 3: headers ---
# Referrer-Policy only when the app sent none. add_header skips a header whose value is empty,
# so an app's own policy goes out alone instead of next to ours (and the last value wins).
map $upstream_http_referrer_policy $referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name app.example.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.example.test;

    ssl_certificate     /certs/app.crt;
    ssl_certificate_key /certs/app.key;

    # nginx 1.29.3+: a location with its own add_header keeps these instead of replacing them.
    # On older nginx, put these lines in a snippet and include it in every location that adds a header.
    add_header_inherit merge;

    # "always" puts them on 404s, 500s, and the error page too.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy $referrer_policy always;
    # A separate CSP header. Browsers enforce every CSP they get, so this one can only tighten
    # whatever policy the app sends. It replaces X-Frame-Options, which the proxy no longer sends.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Content-Type-Options;  # ours replaces the app's copy; nosniff is the only value
    proxy_intercept_errors on;
    error_page 500 502 503 504 @error;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8080;
        add_header Cache-Control "public, max-age=86400";
    }

    location @error {
        default_type text/plain;
        return 502 "Something went wrong.\n";
    }
}
