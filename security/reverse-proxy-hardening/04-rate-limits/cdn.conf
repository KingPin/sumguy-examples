# Stand-in for a CDN or a front proxy (Cloudflare, a VPS running nginx, a tunnel endpoint).
# Each port fronts one origin proxy. Like Cloudflare, it appends the client's address to
# whatever X-Forwarded-For the client sent, so a client can put fake entries on the left.
# conf.d is included inside http {}.
proxy_ssl_server_name on;
proxy_ssl_name app.example.test;
proxy_ssl_verify off;  # throwaway lab cert

server { listen 9001; location / { proxy_pass https://172.31.40.21; include /etc/nginx/cdn-headers.conf; } }
server { listen 9002; location / { proxy_pass https://172.31.40.22; include /etc/nginx/cdn-headers.conf; } }
server { listen 9003; location / { proxy_pass https://172.31.40.23; include /etc/nginx/cdn-headers.conf; } }
# Only up in ./run.sh hardened: the one-change-off variants
server { listen 9004; location / { proxy_pass https://172.31.40.24; include /etc/nginx/cdn-headers.conf; } }
server { listen 9005; location / { proxy_pass https://172.31.40.25; include /etc/nginx/cdn-headers.conf; } }
