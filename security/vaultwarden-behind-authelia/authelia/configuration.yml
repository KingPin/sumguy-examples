server:
  address: 'tcp://:9091/'

log:
  level: 'info'

identity_validation:
  reset_password:
    # jwt_secret supplied by AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
    jwt_lifespan: '5 minutes'

totp:
  issuer: 'vault.yourdomain.com'
  period: 30
  skew: 1

authentication_backend:
  file:
    path: '/config/users.yml'
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4

access_control:
  default_policy: 'deny'
  rules:
    # Bitwarden client paths. These MUST bypass forward auth or every
    # non-browser client fails at login.
    - domain: 'vault.yourdomain.com'
      resources:
        - '^/api($|/.*)'
        - '^/identity($|/.*)'
        - '^/attachments($|/.*)'
        - '^/icons($|/.*)'
        - '^/events($|/.*)'
        - '^/notifications($|/.*)'
        - '^/\.well-known($|/.*)'
        - '^/alive$'
      policy: 'bypass'
    # Catch-all: web vault UI and /admin.
    - domain: 'vault.yourdomain.com'
      policy: 'two_factor'

session:
  # secret supplied by AUTHELIA_SESSION_SECRET_FILE
  expiration: '1 hour'
  inactivity: '5 minutes'
  remember_me: '1 month'
  cookies:
    - name: 'authelia_session'
      domain: 'yourdomain.com'
      authelia_url: 'https://auth.yourdomain.com'
      default_redirection_url: 'https://vault.yourdomain.com'
  redis:
    host: 'redis'
    port: 6379

regulation:
  # Default is ['user'] only, which bans the account and not the attacker.
  modes:
    - 'user'
    - 'ip'
  max_retries: 5
  find_time: '2 minutes'
  ban_time: '10 minutes'

storage:
  # encryption_key supplied by AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
  postgres:
    address: 'tcp://postgres:5432'
    database: 'authelia'
    username: 'authelia'

notifier:
  smtp:
    address: 'smtp://smtp.yourdomain.com:587'
    username: 'vault@yourdomain.com'
    sender: 'Authelia <vault@yourdomain.com>'
    tls:
      skip_verify: false
