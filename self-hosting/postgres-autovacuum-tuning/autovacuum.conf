# Minimal postgresql.conf for the demo container. Not a full config:
# everything not listed here keeps its built-in default.
listen_addresses = '*'

# --- Autovacuum globals (small database, a few hot tables) ---

# Default is -1, which falls back to vacuum_cost_limit = 200.
# 1000 lets each worker do about 5x the work per sleep. The budget is
# shared across all running workers.
autovacuum_vacuum_cost_limit = 1000

# Leave the cost delay at its 2ms default. Raising the limit is the knob to turn.
# autovacuum_vacuum_cost_delay = 2ms

# Log every autovacuum run that takes longer than 1 second.
# The default is 10min, which hides almost everything on a small DB.
log_autovacuum_min_duration = 1s

# Kill sessions that sit "idle in transaction" for 10 minutes.
# Open transactions stop vacuum from removing dead rows newer than their snapshot.
# Default is 0 (never). Test your apps before enabling this on a shared server.
idle_in_transaction_session_timeout = 10min

# Left alone on purpose: autovacuum_naptime (1min), autovacuum_max_workers (3),
# autovacuum_vacuum_scale_factor (0.2), autovacuum_vacuum_threshold (50),
# autovacuum_freeze_max_age (200000000). Fix hot tables per table instead.
