services:
  db:
    image: postgres:18.6
    container_name: avtune
    environment:
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: app
    # Point the server at a tiny config file that holds only the tuned globals.
    # Everything not listed keeps its built-in default.
    command: ["postgres", "-c", "config_file=/etc/postgresql/autovacuum.conf"]
    volumes:
      - ./autovacuum.conf:/etc/postgresql/autovacuum.conf:ro
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
