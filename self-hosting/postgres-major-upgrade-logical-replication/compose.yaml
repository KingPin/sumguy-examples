services:
  old:
    image: postgres:17.11
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: app
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["old_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      retries: 30

  new:
    image: postgres:18.6
    # wal_level=logical here is only needed for the rollback path (new -> old)
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: app
    ports: ["127.0.0.1:55433:5432"]
    # PG 18 images keep the cluster in a version-specific subdirectory of /var/lib/postgresql
    volumes: ["new_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      retries: 30

volumes:
  old_data:
  new_data:
