services:
  hemmelig:
    image: hemmeligapp/hemmelig:v7.6.1
    container_name: hemmelig
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - hemmelig-database:/app/database
      - hemmelig-uploads:/app/uploads
    environment:
      DATABASE_URL: file:/app/database/hemmelig.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      HEMMELIG_BASE_URL: ${PUBLIC_URL}
      NODE_ENV: production
      # Set to "false" to stop new signups.
      HEMMELIG_ALLOW_REGISTRATION: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  hemmelig-database:
  hemmelig-uploads:
