services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shlink
      POSTGRES_USER: shlink
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - shlink-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shlink -d shlink"]
      interval: 5s
      timeout: 3s
      retries: 10

  shlink:
    image: shlinkio/shlink:5.1.8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SHLINK_PORT:-8080}:8080"
    environment:
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN}
      IS_HTTPS_ENABLED: ${IS_HTTPS_ENABLED}
      GEOLITE_LICENSE_KEY: ${GEOLITE_LICENSE_KEY:-}
      INITIAL_API_KEY: ${INITIAL_API_KEY}
      DB_DRIVER: postgres
      DB_HOST: db
      DB_NAME: shlink
      DB_USER: shlink
      DB_PASSWORD: ${DB_PASSWORD}

  web-client:
    image: shlinkio/shlink-web-client:4.9.0
    restart: unless-stopped
    depends_on:
      - shlink
    ports:
      - "127.0.0.1:${WEB_CLIENT_PORT:-8000}:8080"
    environment:
      SHLINK_SERVER_URL: ${SHLINK_SERVER_URL}
      SHLINK_SERVER_API_KEY: ${INITIAL_API_KEY}
      SHLINK_SERVER_NAME: Shlink

volumes:
  shlink-db:
