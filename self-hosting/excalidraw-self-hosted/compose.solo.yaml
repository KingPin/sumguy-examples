# Solo Excalidraw: the stock image, nothing else.
# Drawings live in your browser's localStorage/IndexedDB. Every page load still
# fetches fonts from Excalidraw's DigitalOcean CDN and sends a Simple Analytics
# pageview. "Live collaboration", "Shareable link", the library and the AI tools
# call excalidraw.com's servers (the URLs are baked in at build time).
services:
  excalidraw:
    # The project publishes only :latest plus sha-* tags, so pin the digest.
    image: excalidraw/excalidraw:latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
    ports:
      - "8080:80"
    restart: unless-stopped
