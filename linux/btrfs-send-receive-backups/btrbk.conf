# /etc/btrbk/btrbk.conf
# Options at the top level are inherited by the sections below them.

# Where btrbk finds the SSH key for remote targets.
ssh_identity            /etc/btrbk/ssh/id_ed25519
ssh_user                backup
# backup is not root, so run btrfs through sudo on the target. Allow NOPASSWD
# sudo for btrfs, readlink and test there, or btrbk fails on the first command.
backend_remote          btrfs-progs-sudo

# Compress the stream on the wire. Needs zstd on both hosts.
stream_compress         zstd

# Keep every local snapshot for at least 2 days, then thin out:
# 14 daily, 8 weekly, 6 monthly.
snapshot_preserve_min   2d
snapshot_preserve       14d 8w 6m

# Backups on the target: keep at least 14 days, then 8 weekly, 12 monthly.
target_preserve_min     14d
target_preserve         14d 8w 12m

# The top-level filesystem, mounted with subvolid=5.
volume /mnt/data
  # Relative to the volume. btrbk does not create this directory.
  snapshot_dir          .snapshots

  subvolume files
    target send-receive ssh://backup-host/mnt/backup/files

  subvolume photos
    target send-receive ssh://backup-host/mnt/backup/photos
