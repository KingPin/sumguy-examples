# /etc/tmpfiles.d/myapp.conf
# Type Path                    Mode  User   Group  Age   Argument

# Shared scratch space, not tied to one service. Files untouched for 7 days are removed.
d  /var/tmp/myapp-scratch      0750  myapp  myapp  7d    -

# Upload staging: contents older than 12 hours are cleaned, the directory stays.
d  /var/spool/myapp-uploads    0770  myapp  myapp  12h   -

# Create a note file once (an existing file is left alone) so operators can find where the data lives.
f  /var/lib/myapp-README       0644  myapp  myapp   -     Data lives in /srv/myapp-data

# Symlink so an old hardcoded path keeps working. L+ replaces whatever is there.
L+ /var/lib/myapp-legacy       -     -      -      -     /srv/myapp-data

# Fix ownership and permissions after a restore from backup.
# ~ only removes bits: files without execute bits get 0640, directories keep 0750.
Z  /srv/myapp-data             ~0750 myapp  myapp  -     -

# Never age-clean this subdirectory, even though the parent has an age.
x  /var/tmp/myapp-scratch/keep

# Remove a stale lock file, but only at boot.
r! /var/lib/myapp-stale.lock
