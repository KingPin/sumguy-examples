[Interface]
PrivateKey = <client-private-key>
Address = 10.8.0.2/32
# wg-quick only. The resolver sits on the home LAN, reached through the tunnel.
DNS = 192.168.10.2

[Peer]
PublicKey = <server-public-key>
Endpoint = vpn.example.com:51820
# Split tunnel: only the home LAN and the VPN subnet go through the tunnel.
# The resolver and the service IPs live in 192.168.10.0/24, so this must be listed.
AllowedIPs = 192.168.10.0/24, 10.8.0.0/24
PersistentKeepalive = 25
