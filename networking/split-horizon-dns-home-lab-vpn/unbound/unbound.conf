server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    do-daemonize: no
    username: ""
    chroot: ""

    # Who may ask: loopback, home LAN, WireGuard subnet. Everyone else is refused.
    access-control: 127.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.10.0/24 allow
    access-control: 10.8.0.0/24 allow

    # Rebind protection: strip RFC1918 answers for public names.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    # local-data is exempt by default. private-domain only matters for
    # names that are resolved upstream, such as a public zone you do not override.
    private-domain: "home.example.com."

    # "transparent": names in local-data are answered here, every other name
    # under home.example.com is resolved normally (the public website still works).
    local-zone: "home.example.com." transparent
    local-data: "jellyfin.home.example.com. 300 IN A 192.168.10.20"
    local-data: "nextcloud.home.example.com. 300 IN A 192.168.10.20"
    local-data: "grafana.home.example.com. 300 IN A 192.168.10.21"
