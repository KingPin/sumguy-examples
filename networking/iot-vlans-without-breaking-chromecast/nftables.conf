#!/usr/sbin/nft -f
# Linux router: eth0.10 = trusted LAN (10.0.10.0/24), eth0.20 = IoT (10.0.20.0/24), eth1 = WAN
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif lo accept
    # DHCP and DNS from both LAN segments
    iifname { "eth0.10", "eth0.20" } udp dport { 53, 67 } accept
    iifname { "eth0.10", "eth0.20" } tcp dport 53 accept
    # mDNS to the router itself (needed for the reflector)
    iifname { "eth0.10", "eth0.20" } udp dport 5353 accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept

    # trusted -> IoT: new connections allowed
    iifname "eth0.10" oifname "eth0.20" accept

    # IoT -> Home Assistant only (single host on trusted side)
    iifname "eth0.20" oifname "eth0.10" ip daddr 10.0.10.50 tcp dport 8123 accept

    # trusted and IoT -> internet
    iifname { "eth0.10", "eth0.20" } oifname "eth1" accept
  }
}
