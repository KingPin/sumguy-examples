# Same as nginx.conf, but proxy_pass targets an upstream block with no keepalive line.
# Since nginx 1.29.7 an upstream block caches 32 idle connections per worker by default.
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    access_log    off;
    sendfile      on;
    keepalive_timeout 65;

    upstream backend {
        server whoami:80;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name bench.lab;
        ssl_certificate     /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;

        root /srv/www;

        location /proxy/ {
            proxy_pass http://backend/;
        }
    }
}
