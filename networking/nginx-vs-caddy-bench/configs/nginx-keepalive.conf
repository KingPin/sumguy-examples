# Upstream keepalive spelled out. Needed on nginx older than 1.29.7, which includes the
# packages in current Debian and Ubuntu releases (1.22 to 1.28). Also works on newer nginx.
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    access_log    off;
    sendfile      on;
    keepalive_timeout 65;

    upstream backend {
        server whoami:80;
        keepalive 32;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name bench.lab;
        ssl_certificate     /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;

        root /srv/www;

        location /proxy/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
