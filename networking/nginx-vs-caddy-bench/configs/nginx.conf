# Near-stock nginx: official image defaults, plus TLS and a proxy route.
# proxy_pass points straight at the backend hostname, the way most homelab configs do.
# Only change from the image default: access_log off (Caddy logs nothing by default).
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    access_log    off;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 80;
        listen 443 ssl;
        server_name bench.lab;
        ssl_certificate     /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;

        root /srv/www;

        location /proxy/ {
            proxy_pass http://whoami:80/;
        }
    }
}
