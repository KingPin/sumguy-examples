services:
  unifi-db:
    image: docker.io/mongo:8.0.34
    container_name: unifi-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:?set in .env}
      MONGO_USER: unifi
      MONGO_PASS: ${MONGO_PASS:?set in .env}
      MONGO_DBNAME: unifi
      MONGO_AUTHSOURCE: admin
    volumes:
      - ./data/db:/data/db
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    restart: unless-stopped

  unifi-network-application:
    image: lscr.io/linuxserver/unifi-network-application:10.6.106
    container_name: unifi-network-application
    depends_on:
      - unifi-db
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-Etc/UTC}
      MONGO_USER: unifi
      MONGO_PASS: ${MONGO_PASS:?set in .env}
      MONGO_HOST: unifi-db
      MONGO_PORT: 27017
      MONGO_DBNAME: unifi
      MONGO_AUTHSOURCE: admin
      MEM_LIMIT: 1024
      MEM_STARTUP: 1024
    volumes:
      - ./data/config:/config
    ports:
      - 8443:8443        # web UI (HTTPS)
      - 8080:8080        # device inform / adoption
      - 3478:3478/udp    # STUN
      - 10001:10001/udp  # device discovery
      - 1900:1900/udp    # optional: L2 discovery
      - 8843:8843        # optional: guest portal HTTPS
      - 8880:8880        # optional: guest portal HTTP
      - 6789:6789        # optional: mobile speed test
      - 5514:5514/udp    # optional: remote syslog
    restart: unless-stopped
