services:
  netalertx:
    image: ghcr.io/netalertx/netalertx:latest
    container_name: netalertx
    network_mode: host   # ARP scanning needs Layer 2 access
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN         # arp-scan, nmap, traceroute
      - NET_RAW           # raw sockets for the same tools
      - NET_BIND_SERVICE  # privileged ports for nbtscan
      - CHOWN             # root-entrypoint chowns /data + /tmp
      - SETUID
      - SETGID
    sysctls:
      net.ipv4.conf.all.arp_ignore: 1
      net.ipv4.conf.all.arp_announce: 2
    volumes:
      - type: volume
        source: netalertx_data
        target: /data
        read_only: false
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
      # Custom plugins live under /server/plugins as of v26.9.0:
      # - /path/on/host:/app/server/plugins/custom
    tmpfs:
      - "/tmp:mode=1700,uid=0,gid=0,rw,noexec,nosuid,nodev"
    environment:
      PUID: 20211
      PGID: 20211
      LISTEN_ADDR: 0.0.0.0
      PORT: 20211          # web UI
      GRAPHQL_PORT: 20212  # REST + GraphQL + MCP
      ALWAYS_FRESH_INSTALL: "false"
      NETALERTX_DEBUG: 0
    mem_limit: 2048m
    mem_reservation: 1024m
    pids_limit: 512
    restart: unless-stopped

volumes:
  netalertx_data:
